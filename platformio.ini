; PlatformIO Project Configuration File for TTGO-VGA32-COCO
; Board: LilyGo TTGO-VGA32 (with 4MB PSRAM)
; also supporting
; Board: Olimex ESP32-SBC-FABGL (with 8MB PSRAM, currently using 4MB)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Hardware & Clock Settings ---
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; --- Enable PSRAM (Crucial for Emulators / CoCo Graphics) ---
build_flags =
    -Os
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    ; --- generate memory usage stats and details
    -Wl,--print-memory-usage
    -Wl,-Map=memory.map

debug_build_flags =
    -Og
    -ggdb3
    ; --- Track local function arrays/variables ---
    -fstack-usage

; --- Debugging Configuration ---
; Un-comment the line below to build with debug symbols for GDB / JTAG debugging
; build_type = debug
monitor_filters = esp32_exception_decoder, default

; --- Partition Table Setup ---
; Emulators need large app space. This provides a 4MB no-OTA partition structure.
board_build.partitions = huge_app.csv

; --- Serial Monitor & Upload Settings ---
monitor_speed = 115200
upload_speed = 921600

; --- Libraries ---
lib_deps =
    fdivitto/FabGL @ ^1.0.9

